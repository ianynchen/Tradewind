name: Release

# A pushed tag "v" + a semantic version (for example v0.16.3) on main makes a
# GitHub release named by the version without the "v" (0.16.3), with the
# CHANGELOG section as its notes and the wheel and sdist attached. The checks in
# scripts/release-check.sh run first; if one fails, nothing is released.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check needs origin/main and the tag's history

      - name: Check the tag, the branch and the version
        id: check
        run: |
          version="$(./scripts/release-check.sh "$GITHUB_REF_NAME" release-notes.md)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build (wheel + sdist)
        run: uv build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$VERSION" --notes-file release-notes.md $pre

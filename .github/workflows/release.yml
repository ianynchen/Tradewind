name: Release

# A pushed tag "v" + a semantic version (for example v0.17.0) on main makes a
# GitHub release named by the version without the "v" (0.17.0), with notes that
# GitHub generates from the PRs merged since the previous tag, and the wheel and
# sdist attached. The tag is the version: the build reads it from git
# (hatch-vcs). The checks in scripts/release-check.sh run first; if one fails,
# nothing is released.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check needs origin/main and the tag's history

      - name: Check the tag, the branch and the version
        id: check
        run: |
          version="$(./scripts/release-check.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build (wheel + sdist)
        run: |
          uv build
          # the tag is the version: a build from it must carry exactly that version
          # (in Python's form: 1.0.0-rc.1 is 1.0.0rc1)
          want="$(uv run --no-project --with packaging python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "${{ steps.check.outputs.version }}")"
          ls dist/tradewind-"$want"-*.whl

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$VERSION" --generate-notes $pre

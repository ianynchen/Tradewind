[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradewind"
version = "0.1.0"
description = "Agent infrastructure and policy execution engine"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "anyio>=4",
    "mcp==2.1.1",
    "langchain-anthropic==1.7.0",
    "langchain-core==1.6.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "mypy",
    "ruff",
    "import-linter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "perf: marks tests as performance benchmarks (deselect with '-m \"not perf\"')",
]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unused_configs = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# Domain models legitimately carry `dict[str, Any]` fields (tool schemas,
# MCP passthrough, snapshot output) — pydantic v2 models for these. The
# repo-wide disallow_any_explicit/disallow_any_expr flags go beyond mypy
# --strict and can't be satisfied here without contorting the models
# (see task-2-brief.md "Known friction"). Narrowed to this module only.
module = "tradewind.domain.*"
disallow_any_explicit = false
disallow_any_expr = false

[[tool.mypy.overrides]]
# Same root cause as the domain override above, confirmed by minimal
# repro: any `class Foo(pydantic.BaseModel): ...` subclass — even with
# zero `Any` anywhere in its own body — trips disallow_any_explicit via
# mypy's synthesized `__mypy-replace` member (pydantic's stubs mark
# BaseModel `@dataclass_transform`). config.py's contract (task-6-brief.md)
# mandates several BaseModel classes plus a `cursor_store: Any` field and a
# `model_post_init(self, context: Any, /)` override matching pydantic's own
# signature, so it hits this unconditionally. Narrowed to this module only.
module = "tradewind.application.config"
disallow_any_explicit = false
disallow_any_expr = false

[[tool.mypy.overrides]]
# `ToolHost` is the first application-layer code to actually *invoke* two
# Any-tainted third-party contracts rather than merely store them:
# (1) domain `Tool.handler: Callable[..., Awaitable[Any]]` (task-2-brief.md
#     "Known friction" — same root cause as the domain override above;
#     awaiting it here is unavoidable, ToolHost's whole job is calling it);
# (2) the `mcp` package's own `SessionMessage.metadata` carries
#     `ServerMessageMetadata.request_context: Any` by the SDK's own design
#     ("Typed as Any because the server layer is transport-agnostic",
#     mcp/shared/message.py), which taints every transport stream tuple
#     (`TransportStreams`, `stdio_client`/`streamable_http_client`'s return
#     type) that ToolHost must unpack to open an MCP client session.
# Confirmed by minimal repro: no rewrite of ToolHost's own code (explicit
# annotations, `cast()`) suppresses `disallow_any_expr` here, because the
# flagged sub-expressions are the third-party call/await nodes themselves,
# not anything this module writes. `disallow_any_explicit` stays on — this
# module never spells `Any` itself. Narrowed to this module only.
module = "tradewind.application.tool_host"
disallow_any_expr = false

[[tool.mypy.overrides]]
# `langchain_backend` is the first adapter to actually consume
# `langchain-core`'s own normalized message typing rather than just pass
# opaque objects through. Two of its own public types taint nearly every
# expression this module touches:
# (1) `AIMessage.content_blocks` / `AIMessageChunk.content_blocks` return
#     `list[ContentBlock]`, where `ContentBlock` is a 14-member `Union` of
#     TypedDicts (text/reasoning/tool_call/image/... — langchain_core's own
#     `content.py`). Every `.get(...)` read off one of these dicts is
#     "Expression type contains Any" under `disallow_any_expr`, because at
#     least one union member's value type resolves through `dict[str, Any]`
#     somewhere in that Union — this is the library's own typing, not
#     anything this module writes.
# (2) `AIMessage.tool_calls: list[ToolCall]`, and `ToolCall` itself
#     (`langchain_core.messages.tool`) declares `args: dict[str, Any]` — so
#     every read/write of a tool call's id/name/args is tainted the same
#     way, both when reconstructing history into `ToolCall`s
#     (`_rebuild_messages`) and when reading them back off a model response
#     (`_run_turn`'s tool loop).
# Confirmed by minimal repro: replacing every `.get()`/subscript with an
# explicit `cast(...)` on the *value* still leaves the "Expression type
# contains Any" `[misc]` diagnostic, because the flagged expression is the
# third-party `ContentBlock`/`ToolCall` access itself, not this module's
# annotation of its result — same root cause and same resolution as the
# `tradewind.application.tool_host` override above. `disallow_any_explicit`
# stays on: this module never spells `Any` itself (`object`/`cast` are used
# throughout instead). Narrowed to this module only.
module = "tradewind.adapters.langchain_backend"
disallow_any_expr = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (let formatter handle it)
    "UP009", # UTF-8 encoding declaration is unnecessary
]

[tool.ruff.lint.isort]
known-first-party = ["tradewind"]

[tool.ruff.lint.per-file-ignores]
# Domain error names are a fixed interface every later task consumes verbatim
# (task-2-brief.md); several are exceptions without an "Error" suffix
# (SessionExists, SessionNotFound, TurnInProgress, Unsupported, ToolMismatch).
"src/tradewind/domain/errors.py" = ["N818"]

[tool.importlinter]
root_package = "tradewind"
include_external_packages = true
[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = ["tradewind.adapters", "tradewind.application", "tradewind.domain"]
[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["tradewind.domain"]
forbidden_modules = ["sqlite3", "langchain_anthropic", "claude_agent_sdk", "openai_codex", "cursor_sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradewind"
version = "0.1.0"
description = "Agent infrastructure and policy execution engine"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "anyio>=4",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "mypy",
    "ruff",
    "import-linter",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "perf: marks tests as performance benchmarks (deselect with '-m \"not perf\"')",
]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unused_configs = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# Domain models legitimately carry `dict[str, Any]` fields (tool schemas,
# MCP passthrough, snapshot output) — pydantic v2 models for these. The
# repo-wide disallow_any_explicit/disallow_any_expr flags go beyond mypy
# --strict and can't be satisfied here without contorting the models
# (see task-2-brief.md "Known friction"). Narrowed to this module only.
module = "tradewind.domain.*"
disallow_any_explicit = false
disallow_any_expr = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (let formatter handle it)
    "UP009", # UTF-8 encoding declaration is unnecessary
]

[tool.ruff.lint.isort]
known-first-party = ["tradewind"]

[tool.ruff.lint.per-file-ignores]
# Domain error names are a fixed interface every later task consumes verbatim
# (task-2-brief.md); several are exceptions without an "Error" suffix
# (SessionExists, SessionNotFound, TurnInProgress, Unsupported, ToolMismatch).
"src/tradewind/domain/errors.py" = ["N818"]

[tool.importlinter]
root_package = "tradewind"
include_external_packages = true
[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = ["tradewind.adapters", "tradewind.application", "tradewind.domain"]
[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["tradewind.domain"]
forbidden_modules = ["sqlite3", "langchain_anthropic", "claude_agent_sdk", "openai_codex", "cursor_sdk"]

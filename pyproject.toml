[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradewind"
version = "0.8.0"
description = "Agent infrastructure and policy execution engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "anyio>=4",
    "mcp==2.1.1",
    "langchain-anthropic==1.7.0",
    "langchain-core==1.6.1",
    "claude-agent-sdk==0.2.151",
    "openai-codex==0.147.0",
    "cursor-sdk==1.0.30",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "mypy",
    "ruff",
    "import-linter",
    "langchain-groq>=1.1.3",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradewind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "perf: marks tests as performance benchmarks (deselect with '-m \"not perf\"')",
]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_configs = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
# Domain models legitimately carry `dict[str, Any]` fields (tool schemas,
# MCP passthrough, snapshot output) — pydantic v2 models for these. The
# repo-wide disallow_any_explicit/disallow_any_expr flags go beyond mypy
# --strict and can't be satisfied here without contorting the models
# (see task-2-brief.md "Known friction"). Narrowed to this module only.
module = "tradewind.domain.*"
disallow_any_explicit = false
disallow_any_expr = false

[[tool.mypy.overrides]]
# Same root cause as the domain override above, confirmed by minimal
# repro: any `class Foo(pydantic.BaseModel): ...` subclass — even with
# zero `Any` anywhere in its own body — trips disallow_any_explicit via
# mypy's synthesized `__mypy-replace` member (pydantic's stubs mark
# BaseModel `@dataclass_transform`). config.py's contract (task-6-brief.md)
# mandates several BaseModel classes plus a `cursor_store: Any` field and a
# `model_post_init(self, context: Any, /)` override matching pydantic's own
# signature, so it hits this unconditionally. Narrowed to this module only.
module = "tradewind.application.config"
disallow_any_explicit = false
disallow_any_expr = false

[[tool.mypy.overrides]]
# `turn_runner` gained its first direct reads of `StoredMessage.content`
# (`dict[str, Any]` by the domain's own typing -- see the `tradewind.domain`
# override's rationale) with FR-9.3's `_render_child_block`: rendering a
# descendant transcript means reading each stored message's content dict,
# and -- same root cause as the `tool_host`/`langchain_backend` overrides
# below, confirmed the same way -- the flagged expression is the Any-typed
# field access itself, which no cast on the *result* suppresses under
# `disallow_any_expr`. `disallow_any_explicit` stays on: this module never
# spells `Any` itself. Narrowed to this module only.
module = "tradewind.application.turn_runner"
disallow_any_expr = false

[[tool.mypy.overrides]]
# `ToolHost` is the first application-layer code to actually *invoke* two
# Any-tainted third-party contracts rather than merely store them:
# (1) domain `Tool.handler: Callable[..., Awaitable[Any]]` (task-2-brief.md
#     "Known friction" — same root cause as the domain override above;
#     awaiting it here is unavoidable, ToolHost's whole job is calling it);
# (2) the `mcp` package's own `SessionMessage.metadata` carries
#     `ServerMessageMetadata.request_context: Any` by the SDK's own design
#     ("Typed as Any because the server layer is transport-agnostic",
#     mcp/shared/message.py), which taints every transport stream tuple
#     (`TransportStreams`, `stdio_client`/`streamable_http_client`'s return
#     type) that ToolHost must unpack to open an MCP client session.
# Confirmed by minimal repro: no rewrite of ToolHost's own code (explicit
# annotations, `cast()`) suppresses `disallow_any_expr` here, because the
# flagged sub-expressions are the third-party call/await nodes themselves,
# not anything this module writes. `disallow_any_explicit` stays on — this
# module never spells `Any` itself. Narrowed to this module only.
module = "tradewind.application.tool_host"
disallow_any_expr = false

[[tool.mypy.overrides]]
# `langchain_backend` is the first adapter to actually consume
# `langchain-core`'s own normalized message typing rather than just pass
# opaque objects through. Two of its own public types taint nearly every
# expression this module touches:
# (1) `AIMessage.content_blocks` / `AIMessageChunk.content_blocks` return
#     `list[ContentBlock]`, where `ContentBlock` is a 14-member `Union` of
#     TypedDicts (text/reasoning/tool_call/image/... — langchain_core's own
#     `content.py`). Every `.get(...)` read off one of these dicts is
#     "Expression type contains Any" under `disallow_any_expr`, because at
#     least one union member's value type resolves through `dict[str, Any]`
#     somewhere in that Union — this is the library's own typing, not
#     anything this module writes.
# (2) `AIMessage.tool_calls: list[ToolCall]`, and `ToolCall` itself
#     (`langchain_core.messages.tool`) declares `args: dict[str, Any]` — so
#     every read/write of a tool call's id/name/args is tainted the same
#     way, both when reconstructing history into `ToolCall`s
#     (`_rebuild_messages`) and when reading them back off a model response
#     (`_run_turn`'s tool loop).
# Confirmed by minimal repro: replacing every `.get()`/subscript with an
# explicit `cast(...)` on the *value* still leaves the "Expression type
# contains Any" `[misc]` diagnostic, because the flagged expression is the
# third-party `ContentBlock`/`ToolCall` access itself, not this module's
# annotation of its result — same root cause and same resolution as the
# `tradewind.application.tool_host` override above. `disallow_any_explicit`
# stays on: this module never spells `Any` itself (`object`/`cast` are used
# throughout instead). Narrowed to this module only.
module = "tradewind.adapters.langchain_backend"
disallow_any_expr = false

[[tool.mypy.overrides]]
# `claude_backend` is the first adapter to consume `claude-agent-sdk`'s own
# typing, which is `Any`-tainted even more pervasively than `langchain-core`'s
# (the override above): `ContentBlock`'s member dataclasses carry `dict[str,
# Any]` fields directly (`ToolUseBlock.input`, `ToolResultBlock.content: str |
# list[dict[str, Any]] | None`); `AssistantMessage.usage`/`ResultMessage.usage`
# are `dict[str, Any] | None`; `SessionMessage.message` (the raw transcript
# entry `read_native_transcript`/`native_transcript_items` map) is typed bare
# `Any` by the SDK itself ("Raw Anthropic API message dict", `SessionMessage`'s
# own docstring) since it is Anthropic wire JSON, not one of the SDK's own
# dataclasses. Confirmed by minimal repro, same root cause as the
# `langchain_backend` override: every read of one of these fields is
# "Expression type contains Any" under `disallow_any_expr` regardless of how
# this module annotates or casts the *result*, because the flagged expression
# is the third-party field access itself.
#
# `disallow_any_explicit` is ALSO relaxed here (unlike `tool_host`/
# `langchain_backend`, which keep it on): building the in-process SDK MCP
# bridge (`_sdk_tool_from_schema`, `_build_mcp_servers`) and the `can_use_tool`
# bridge (`_make_can_use_tool`) requires spelling the SDK's own `Any`-shaped
# contracts back at it verbatim -- `SdkMcpTool[Any]` (the type parameter has no
# narrower value once `input_schema` is a caller-declared JSON Schema dict,
# same as `create_sdk_mcp_server`'s own examples), `SdkMcpTool.handler:
# Callable[[dict[str, Any]], Awaitable[dict[str, Any]]]`, and
# `ClaudeAgentOptions.system_prompt: str | SystemPromptPreset | ... | None`
# where `SystemPromptPreset` is a `TypedDict` mypy will not structurally match
# from a plain dict literal without a `cast(Any, ...)` past it. Narrowed to
# this module only.
module = "tradewind.adapters.claude_backend"
disallow_any_explicit = false
disallow_any_expr = false

[[tool.mypy.overrides]]
# `tradewind.toolproxy.__main__` (task-12 brief) is a leaf module by design
# -- it must not import `tradewind.application`, so it talks to the `mcp`
# package's own low-level server API (`mcp.server.lowlevel.Server`,
# `mcp.server.context.ServerRequestContext`, `mcp_types.Tool` et al.)
# directly, rather than through `tool_host.py`'s already-relaxed module.
# Two root causes, both third-party, confirmed by minimal repro:
# (1) `mcp_types.Tool`/`ListToolsResult`/`CallToolResult`/
#     `CallToolRequestParams` are pydantic v2 models with `Any`-typed
#     fields (`Tool.input_schema: dict[str, Any]`,
#     `CallToolRequestParams.arguments: dict[str, Any] | None`,
#     `CallToolResult.structured_content: Any`) -- same root cause as the
#     `tradewind.domain` override ("every subclass trips
#     `disallow_any_explicit` via mypy's synthesized `__mypy-replace`
#     member"): constructing or reading one of these taints the expression
#     regardless of how this module casts the value going in or coming out.
# (2) `mcp.server.context.ServerRequestContext[LifespanResultT]`'s second
#     type parameter (`RequestT`) defaults to `Any` -- the SDK's own
#     `server.py` uses this identical single-argument form throughout its
#     own handler type aliases (`RequestHandler`, `on_list_tools`,
#     `on_call_tool`, ...), so matching the library's own handler
#     signatures for `Server(on_list_tools=..., on_call_tool=...)` requires
#     writing the same form here. Relatedly, an `async def` handler
#     assigned to `on_list_tools=`/`on_call_tool=` types as
#     `Coroutine[Any, Any, T]` per Python's own typing for coroutine
#     functions -- same root cause as the `tradewind.domain`
#     `Callable[..., Awaitable[Any]]` friction.
# `tradewind.toolproxy.protocol` (the wire-format module the shim and
# `tool_host.py` both import) needs no override and stays fully strict --
# only this module, which touches the third-party SDK surface directly, is
# narrowed.
module = "tradewind.toolproxy.__main__"
disallow_any_explicit = false
disallow_any_expr = false

[[tool.mypy.overrides]]
# `codex_backend` is the second adapter (after `claude_backend`) to consume
# a third-party SDK whose own typing is pervasively `Any`-tainted, for the
# same reasons as that module's own override: `openai_codex`'s generated
# pydantic v2 models (`generated/v2_all.py`) carry `Any`-typed fields
# directly (`McpToolCallThreadItem.arguments: Any`,
# `DynamicToolCallThreadItem.arguments: Any`, `TurnStartParams.output_schema:
# Any | None`, `McpToolCallResult.content: list` i.e. `list[Any]`,
# `McpToolCallResult.structured_content: Any`), and -- same root cause as the
# `tradewind.domain`/`claude_backend` overrides -- every subclass of a
# pydantic `BaseModel` trips `disallow_any_explicit` via mypy's synthesized
# `__mypy-replace` member regardless of whether that subclass's own body
# spells `Any`, so constructing or reading any of `openai_codex`'s many
# generated dataclasses (`ThreadStartParams`, `TurnStartParams`, `Thread`,
# `Turn`, `ThreadItem`'s RootModel variants, ...) taints the expression this
# module touches, not anything written here. Confirmed by minimal repro,
# same shape as the `claude_backend` override's own confirmation.
#
# `disallow_any_explicit` is ALSO relaxed here (same as `claude_backend`,
# unlike `tool_host`/`langchain_backend`): the sync-to-async approval bridge
# (`_decide`, `make_approval_handler`) and the tool-call mapping
# (`thread_item_to_messages`) must spell `dict[str, Any]` back at
# `PermissionBroker.decide`'s own signature (`tradewind.domain.models`) and
# at `openai_codex`'s own `arguments: Any` fields verbatim -- there is no
# narrower type to give either without inventing one the SDK itself doesn't
# have. Narrowed to this module only.
module = "tradewind.adapters.codex_backend"
disallow_any_explicit = false
disallow_any_expr = false

[[tool.mypy.overrides]]
# `cursor_backend` is the third adapter (after `claude_backend`/
# `codex_backend`) to consume a third-party SDK whose own typing is
# pervasively `Any`-tainted, for the same reasons as those two modules' own
# overrides: `cursor_sdk.types` carries `Any`-typed fields directly
# (`SDKToolUseMessage.args: Any`, `SDKToolUseMessage.result: Any`,
# `ToolUseBlock.input: Any`, `RunStreamEvent.result: Mapping[str, Any] |
# None`, `RunStreamEvent.done: Mapping[str, Any] | None`), and its own
# `CustomTool.execute` is typed `Callable[[Mapping[str, Any],
# CustomToolContext], Any]` (`CustomToolExecute`) -- the tool-call bridge
# (`_build_custom_tools`) must spell that shape back at the SDK verbatim,
# there is no narrower type to give it without inventing one the SDK itself
# doesn't have. Confirmed by minimal repro, same root cause and same
# resolution as the `claude_backend`/`codex_backend` overrides: every read
# of one of these fields, or construction of a `CustomTool`, is "Expression
# type contains Any" under `disallow_any_expr` regardless of how this module
# annotates or casts the result. `disallow_any_explicit` is ALSO relaxed
# here (same as `claude_backend`/`codex_backend`), for the same
# `CustomTool.execute`/`Mapping[str, Any]` spelling reason. Narrowed to this
# module only.
module = "tradewind.adapters.cursor_backend"
disallow_any_explicit = false
disallow_any_expr = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (let formatter handle it)
    "UP009", # UTF-8 encoding declaration is unnecessary
]

[tool.ruff.lint.isort]
known-first-party = ["tradewind"]

[tool.ruff.lint.per-file-ignores]
# Domain error names are a fixed interface every later task consumes verbatim
# (task-2-brief.md); several are exceptions without an "Error" suffix
# (SessionExists, SessionNotFound, TurnInProgress, Unsupported, ToolMismatch).
"src/tradewind/domain/errors.py" = ["N818"]

[tool.importlinter]
root_package = "tradewind"
include_external_packages = true
[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = ["tradewind.adapters", "tradewind.application", "tradewind.domain"]
[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["tradewind.domain"]
forbidden_modules = ["sqlite3", "langchain_anthropic", "claude_agent_sdk", "openai_codex", "cursor_sdk"]
